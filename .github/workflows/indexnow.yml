name: IndexNow ping

# Submits every sitemap URL to api.indexnow.org (Bing, Naver, Seznam) after a
# push to main, once the Vercel production deploy has had time to go live.
# Bing's index is what ChatGPT search retrieves from, so new and updated pages
# get discovered in hours instead of weeks.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the Vercel production deploy
        run: sleep 180
      - name: Submit sitemap URLs to IndexNow
        run: node scripts/indexnow-ping.mjs
